<svg xmlns="http://www.w3.org/2000/svg" width="600" height="690" viewBox="0 0 600 690" role="img" aria-labelledby="title desc">
<title id="title">中国人寿：ATM IV下降，推荐Call权利金上升</title>
<desc id="desc">两个独立刻度面板。2026年10月6日至13日，ATM隐含波动率由35.3%降至34.6%；三个月105%执行价Call的ask权利金占现价比例由4.7%升至5.3%。两个指标的含义与刻度不同。</desc>
<rect width="600" height="690" rx="16" fill="#f4f3ed"/>
<g font-family="system-ui, -apple-system, sans-serif" fill="#202a29">
<text x="32" y="42" font-size="22" font-weight="600">中国人寿 · 2628 HK</text>
<text x="32" y="75" font-size="20" fill="#53615f">观察日：2026年10月6日 → 10月13日</text>
<rect x="24" y="100" width="552" height="258" rx="12" fill="#ffffff"/>
<text x="44" y="139" font-size="24" font-weight="600">ATM 隐含波动率</text>
<text x="44" y="171" font-size="21" fill="#53615f">单位：%　变化：−0.7 个百分点</text>
<text x="44" y="221" font-size="21">10/06</text>
<rect x="128" y="195" width="317.7" height="36" rx="3" fill="#b4c3bc"/>
<text x="458" y="221" font-size="24" font-weight="600">35.3</text>
<text x="44" y="279" font-size="21">10/13</text>
<rect x="128" y="253" width="311.4" height="36" rx="3" fill="#35634f"/>
<text x="452" y="279" font-size="24" font-weight="600">34.6</text>
<path d="M128 303H488" stroke="#b8c3bd"/>
<g font-size="19" fill="#53615f" text-anchor="middle"><text x="128" y="331">0</text><text x="308" y="331">20</text><text x="488" y="331">40%</text></g>
<rect x="24" y="378" width="552" height="288" rx="12" fill="#ffffff"/>
<text x="44" y="417" font-size="24" font-weight="600">推荐 Call 的卖价权利金（ask）</text>
<text x="44" y="450" font-size="21" fill="#53615f">3个月 · 105%执行价 · 占现价比例</text>
<text x="44" y="481" font-size="21" fill="#53615f">单位：%现价　变化：+0.6 个百分点</text>
<text x="44" y="529" font-size="21">10/06</text>
<rect x="128" y="503" width="282" height="36" rx="3" fill="#dac3ab"/>
<text x="423" y="529" font-size="24" font-weight="600">4.7</text>
<text x="44" y="587" font-size="21">10/13</text>
<rect x="128" y="561" width="318" height="36" rx="3" fill="#a56837"/>
<text x="459" y="587" font-size="24" font-weight="600">5.3</text>
<path d="M128 611H488" stroke="#c9bcb0"/>
<g font-size="19" fill="#53615f" text-anchor="middle"><text x="128" y="641">0</text><text x="308" y="641">3</text><text x="488" y="641">6%</text></g>
</g></svg>
